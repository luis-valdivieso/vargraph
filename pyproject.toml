[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vargraph"
version = "0.1.0"
description = "A Python library for modeling graphs with symbolic edge weights"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "sympy>=1.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]